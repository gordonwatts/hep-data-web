<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HEP Data LLM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bs-primary: #17324d;
        --portal-bg: #f6f1e8;
        --portal-surface: #ffffff;
        --portal-text: #394654;
        --portal-border: #d8d1c3;
        --portal-accent: #9b6b43;
      }
      body {
        background: var(--portal-bg);
        color: var(--portal-text);
      }
      .portal-shell {
        max-width: 1200px;
      }
      .card {
        border-color: var(--portal-border);
      }
      .portal-code {
        background: #111827;
        color: #e5e7eb;
        border-radius: .5rem;
        padding: 1rem;
        overflow-x: auto;
      }
      .text-accent {
        color: var(--portal-accent);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container portal-shell">
        <a class="navbar-brand fw-semibold" href="/">HEP Data LLM</a>
      </div>
    </nav>
    <main class="container portal-shell py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

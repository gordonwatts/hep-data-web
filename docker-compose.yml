services:
  docker:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375"]
    volumes:
      - docker_data:/var/lib/docker
      - analysis_tmp:/tmp

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: hep_data_web.settings.dev
      DATABASE_URL: postgresql://hep_data_web:hep_data_web@postgres:5432/hep_data_web
      DOCKER_HOST: tcp://docker:2375
      HOME: /host-home
      USERPROFILE: /host-home
      TMPDIR: /tmp
      HEP_DATA_LLM_HOME_DIR: /host-home
      HEP_DATA_LLM_SERVICEX_AWKWARD_DOCKER_IMAGE: hepdatallm-awkward:latest
    volumes:
      - type: bind
        source: ${USERPROFILE}
        target: /host-home
      - type: volume
        source: media_data
        target: /app/media
      - type: volume
        source: static_data
        target: /app/staticfiles
      - type: volume
        source: analysis_tmp
        target: /tmp
    depends_on:
      - docker
      - postgres

  worker:
    build: .
    command: uv run python manage.py run_worker
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: hep_data_web.settings.dev
      DATABASE_URL: postgresql://hep_data_web:hep_data_web@postgres:5432/hep_data_web
      DOCKER_HOST: tcp://docker:2375
      HOME: /host-home
      USERPROFILE: /host-home
      TMPDIR: /tmp
      HEP_DATA_LLM_HOME_DIR: /host-home
      HEP_DATA_LLM_SERVICEX_AWKWARD_DOCKER_IMAGE: hepdatallm-awkward:latest
    volumes:
      - type: bind
        source: ${USERPROFILE}
        target: /host-home
      - type: volume
        source: media_data
        target: /app/media
      - type: volume
        source: static_data
        target: /app/staticfiles
      - type: volume
        source: analysis_tmp
        target: /tmp
    depends_on:
      - docker
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hep_data_web
      POSTGRES_USER: hep_data_web
      POSTGRES_PASSWORD: hep_data_web
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  analysis_tmp:
  docker_data:
  postgres_data:
  media_data:
  static_data:
